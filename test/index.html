<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="sectionSele">
        <h3 class="sectiontext"><a href="#day">Next Day</a></h3>
        <h3 class="sectiontext"><a href="#week">Next Week</a></h3>
        <h3 class="sectiontext"><a href="#month">Next Month</a></h3>
        <h3 class="sectiontext"><a href="#World">Next World Cup</a></h3>
        <h3 class="sectiontext"><a href="#School">Next School Year</a></h3>
        <h3 class="sectiontext"><a href="#year">Next Year</a></h3>
        <h3 class="sectiontext"><a href="#decade">Next Decade</a></h3>
    </div>
    <div class="header">
        <h1>The Clock is always ticking</h1>
    </div>

    <div class=container>
        <h1 class="timertext">Time until next day</h1>
        <p id="day"></p>
    </div>

    <div class=container>
        <h1 class="timertext">Time until next week</h1>
        <p id="week"></p>
    </div>

    <div class=container>
        <h1 class="timertext">Time until next month</h1>
        <p id="month"></p>
    </div>

    <div class=container>
        <h1 class="timertext">Time until next World Cup</h1>
        <p id="World"></p>
    </div>

    <div class=container>
        <h1 class="timertext">Time until next School Year</h1>
        <p id="School"></p>
    </div>

    <div class=container>
        <h1 class="timertext">Time until next Year</h1>
        <p id="year"></p>
    </div>

    <div class=container>
        <h1 class="timertext">Time until next Decade</h1>
        <p id="decade"></p>
    </div>

</body>
<script src="script.js"></script>

</html>
